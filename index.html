<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
    <title>Nullscape lobby stylizer</title>
</head>

<body>
    <main>
        <header class="page-header">
        </header>
        <section class="first-section">
            <div class="text-editor-container">

                <h1 class="text-editor-title">Name your lobby.</h1>
                <textarea class="text-editor" id="editor" placeholder="@Mart's lobby" spellcheck="false"
                    autocomplete="off" autocorrect="off" autocapitalize="off" maxlength="35"
                    overflow="hidden"></textarea>
                <div id="display-view" class="hidden-display-view">
                    <p class="preview-text">( Will display as: <span id="display-name" class="preview-text"></span> )
                    </p>
                </div>
            </div>
            <div class="button-row">
                <button class="copy-button" id="copy-button">
                    <span class="copy-button-text">Copy</span>
                </button>

                <button class="style-button" id="font-button">
                    <span class="style-button-text">Font</span>
                </button>

                <button class="style-button" id="color-button">
                    <span class="style-button-text">Color</span>
                </button>

                <button class="style-button" id="style-button">
                    <span class="style-button-text">Style</span>
                </button>
            </div>
        </section>
        <div>

        </div>

        <div>

        </div>

        <div>

        </div>
        <footer class="page-footer">
            <small></small>
            <p>Created by GabyDev! (AKA dogezineo/foxybryt)</p>
        </footer>
    </main>
</body>

</html>
