<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Arimo:ital,wght@0,400..700;1,400..700&family=Balthazar&family=Bangers&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Creepster&family=Fondamento&family=Fredoka:wght@400..700&family=Grenze+Gotisch:wght@400..900&family=Inconsolata:wght@400..700&family=Indie+Flower&family=Josefin+Sans:ital,wght@0,400;1,400&family=Jura:wght@400..700&family=Kalam:wght@400;700&family=Luckiest+Guy&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,400..700;1,400..700&family=Nunito:ital,wght@0,400..700;1,400..700&family=Oswald:wght@400..700&family=Patrick+Hand&family=Permanent+Marker&family=Press+Start+2P&family=Roboto:ital,wght@0,400;0,700;1,400&family=Roboto+Condensed:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&family=Sarpanch:wght@400;700&family=Source+Sans+3:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Titillium+Web:ital,wght@0,400;0,700;1,400&family=Ubuntu:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
    <title>Nullscape lobby stylizer</title>
</head>

<body>
    <div class="wrapper">
        <aside class="aside aside-left" aria-label="Left sidebar placeholder"></aside>
        <main>
            <header class="page-header">
            </header>
            <section class="first-section">
                <div class="text-editor-container">

                    <h1 class="text-editor-title">Name your lobby.</h1>
                    <div class="text-editor-wrap">
                        <div id="editor-highlight-overlay" class="text-editor-highlight-overlay" aria-hidden="true">
                        </div>
                        <textarea class="text-editor" id="editor" placeholder="@Mart's lobby" spellcheck="false"
                            autocomplete="off" autocorrect="off" autocapitalize="off" maxlength="35" wrap="off"
                            overflow="hidden"></textarea>
                    </div>
                    <div id="display-view" class="hidden-display-view">
                        <p class="preview-text">( <span id="display-label" class="preview-text">Will display as:</span>
                            <span id="display-name" class="preview-text"></span>
                            )
                        </p>
                    </div>
                </div>
                <div class="button-row">
                    <button class="copy-button" id="copy-button">
                        <span class="copy-button-text">Copy</span>
                    </button>

                    <button class="style-button" id="font-button">
                        <span class="style-button-text">Font</span>
                    </button>

                    <button class="style-button" id="color-button">
                        <span class="style-button-text">Color</span>
                    </button>

                    <button class="style-button" id="style-button">
                        <span class="style-button-text">Style</span>
                    </button>
                </div>
            </section>
            <footer class="page-footer">
                <p>Created by GabyDev! (AKA dogezineo/foxybryt)</p>
            </footer>
        </main>
        <aside class="aside">
            <div class="aside-right">
                <div class="color-panel-wrap" id="color-panel-wrap">
                    <div class="outline-join-popup" id="outline-join-popup" aria-hidden="true">
                        <div class="outline-join-options" id="outline-join-options">
                            <button type="button" class="outline-join-option" id="join-miter" data-join="miter"
                                aria-pressed="false" title="Miter join">
                                <span class="outline-join-letter">M</span>
                            </button>
                            <button type="button" class="outline-join-option" id="join-round" data-join="round"
                                aria-pressed="false" title="Round join">
                                <span class="outline-join-letter">R</span>
                            </button>
                            <button type="button" class="outline-join-option" id="join-bevel" data-join="bevel"
                                aria-pressed="false" title="Bevel join">
                                <span class="outline-join-letter">B</span>
                            </button>
                        </div>
                    </div>
                    <div class="box aside-top-right">
                        <div class="color-header">
                            <span class="color-label">Color picker</span>
                            <button type="button" class="outline-toggle" id="outline-toggle" aria-pressed="false"
                                title="Toggle text outline">
                                <span class="outline-toggle-box">
                                    <svg class="outline-toggle-check" viewBox="0 0 16 16" aria-hidden="true"
                                        focusable="false">
                                        <path d="M3 8.5L6.5 12L13 4.5" />
                                    </svg>
                                </span>
                                <span class="outline-toggle-label">Text outline</span>
                            </button>
                        </div>

                        <div class="color-picker" id="color-picker">
                            <div class="picker-main">
                                <div class="sv-wrap">
                                    <div class="sv" id="sv">
                                        <div class="sv-cursor" id="sv-cursor"></div>
                                    </div>
                                </div>
                                <div class="hue-wrap">
                                    <div class="hue" id="hue">
                                        <div class="hue-cursor" id="hue-cursor"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="color-footer">
                        <button id="color-circle" class="color-circle" title="Current color — click to select hex"
                            aria-label="Currently selected color"></button>
                        <input id="color-hex-input" class="color-hex-input" type="text" maxlength="7" value="#ff33cc"
                            aria-label="Hex color input" spellcheck="false" autocomplete="off">
                    </div>
                    <div class="color-opacity-row">
                        <label class="color-opacity-label" for="color-opacity-input" id="color-opacity-label">Opacity</label>
                        <input id="color-opacity-input" class="color-opacity-slider" type="range" min="0" max="100"
                            step="1" value="100" aria-label="Text opacity">
                        <span id="color-opacity-value" class="color-opacity-value">100%</span>
                    </div>
                </div>
                <div class="box aside-bottom-right">
                    <div class="style-box-inner">
                        <div class="style-box-header">
                            <span class="style-box-label">Style</span>
                        </div>
                        <div class="style-options">
                            <button type="button" class="style-option" id="style-bold" data-style="bold"
                                aria-pressed="false" title="Bold">
                                <span class="style-option-letter style-option-letter--bold">B</span>
                            </button>
                            <button type="button" class="style-option" id="style-italic" data-style="italic"
                                aria-pressed="false" title="Italic">
                                <span class="style-option-letter style-option-letter--italic">I</span>
                            </button>
                            <button type="button" class="style-option" id="style-underline" data-style="underline"
                                aria-pressed="false" title="Underline">
                                <span class="style-option-letter style-option-letter--underline">U</span>
                            </button>

                            <button type="button" class="style-option" id="style-strikethrough"
                                data-style="strikethrough" aria-pressed="false" title="Strikethrough">
                                <span class="style-option-letter style-option-letter--strikethrough">S</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="box aside-left-full">
                <div class="font-box-inner">
                    <div class="font-box-header">
                        <span class="font-box-label">Fonts</span>
                    </div>
                    <div class="font-list" id="font-list"></div>
                </div>
            </div>
        </aside>
    </div>
</body>

</html>
